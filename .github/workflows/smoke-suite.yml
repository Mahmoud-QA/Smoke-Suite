name: Smoke Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'   # Daily at 06:00 UTC
  workflow_dispatch:

jobs:
  smoke-tests:
    name: Smoke Suite — ${{ matrix.env_name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - env_name: Dev
            base_url: https://synkvault-web-dev-enterprise-386722944781.europe-west2.run.app
            artifact_tag: dev
            pages_dir: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Set credentials for environment
        run: |
          if [ "${{ matrix.env_name }}" = "Dev" ] && [ -n "${{ secrets.DEV_EMAIL }}" ]; then
            echo "RUN_EMAIL=${{ secrets.DEV_EMAIL }}" >> $GITHUB_ENV
            echo "RUN_PASSWORD=${{ secrets.DEV_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "RUN_EMAIL=${{ secrets.TEST_EMAIL }}" >> $GITHUB_ENV
            echo "RUN_PASSWORD=${{ secrets.TEST_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Create screenshots directory
        run: mkdir -p screenshots

      - name: Run Smoke Suite — ${{ matrix.env_name }}
        run: npm run test:smoke
        continue-on-error: true
        env:
          BASE_URL: ${{ matrix.base_url }}
          TEST_EMAIL: ${{ env.RUN_EMAIL }}
          TEST_PASSWORD: ${{ env.RUN_PASSWORD }}

      - name: Restore Allure history from gh-pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy history into allure-results
        if: always()
        continue-on-error: true
        run: |
          if [ -d "gh-pages/${{ matrix.pages_dir }}/history" ]; then
            mkdir -p allure-results
            cp -r "gh-pages/${{ matrix.pages_dir }}/history" allure-results/history
          fi

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload allure-results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.artifact_tag }}-run-${{ github.run_number }}
          path: allure-results/
          retention-days: 30

      - name: Upload allure-report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-${{ matrix.artifact_tag }}-run-${{ github.run_number }}
          path: allure-report/
          retention-days: 30

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always() && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          destination_dir: ${{ matrix.pages_dir }}
          keep_files: true
